---
# Galaxy name and version
galaxy_name: "csf"
galaxy_version: "22.05"

# Galaxy user
galaxy_user: "galaxy"
galaxy_uid: 400
galaxy_group: "{{ galaxy_user }}"
galaxy_gid: 400

# Galaxy source code
galaxy_repo: "https://github.com/galaxyproject/galaxy.git"
galaxy_version_tag: "release_{{ galaxy_version }}"

# Galaxy installation directory
galaxy_root_dir: "/mnt/rvmi/{{ galaxy_name }}/galaxy"
galaxy_install_dir: "{{ galaxy_root_dir }}/shared/csf-slurm/galaxy/{{ galaxy_version }}"

# Python for Galaxy
python_version: "3.6.11"
python_install_dir: '{{ galaxy_root_dir }}/shared/csf-slurm/python/{{ python_version }}'

# Options related to building Galaxy
#
# Sets the NODE_OPTIONS envirnoment variable when
# running 'common_startup.sh'
galaxy_node_options:

# Exported tgz
archive_name: "{{ galaxy_name }}-virtualenv-galaxy-{{ galaxy_version }}-python-{{ python_version }}-slurm"
assets_dir: "assets/"