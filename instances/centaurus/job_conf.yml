---
# job_conf.xml configuration

# Job runners and destinations
galaxy_job_destinations:
  # Serial jobs
  - id: "jse_drop_serial"
    runner: "jse_drop"
    jse_drop_submit_options: "-p serial -t 7-0"
  # Multicore jobs
  - id: "jse_drop_smp_4"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 4 -t 7-0"
    jse_drop_slots: "4"
  - id: "jse_drop_smp_6"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 6 -t 7-0"
    jse_drop_slots: "6"
  - id: "jse_drop_smp_8"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 8 -t 7-0"
    jse_drop_slots: "8"
  - id: "jse_drop_smp_12"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 12 -t 7-0"
    jse_drop_slots: "12"
  - id: "jse_drop_smp_16"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 16 -t 7-0"
    jse_drop_slots: "16"
  # High memory runner
  - id: "jse_drop_smp_4_mem512"
    runner: "jse_drop"
    # Minimum 32GB/core = 128GB
    jse_drop_submit_options: "-p himem -n 4 -t 7-0"
    jse_drop_slots: "4"
    envs:
      - id: "GALAXY_MEMORY_MB"
        value: "131072"
  # Short serial queue runner for quick jobs (or testing)
  - id: "jse_drop_short"
    runner: "jse_drop"
    jse_drop_submit_options: "-p serial -t 0-1"
  # Runner for Amplicon analysis pipeline
  - id: "jse_drop_amplicon_analysis"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 8 -t 7-0"
    jse_drop_slots: "8"
    envs:
      - id: "AMPLICON_ANALYSIS_REF_DATA_PATH"
        value: "/mnt/data-sets/bcf/softwareData/galaxy/amplicon-analysis-pipeline"
  # Runner for NCBI Blast+
  - id: "jse_drop_ncbi_blast_plus"
    runner: "jse_drop"
    # Minimum 32GB/core = 256GB
    jse_drop_submit_options: "-p himem -n 8 -t 7-0"
    jse_drop_slots: "8"
  # Runner for Picard MarkDuplicates (needs Java options)
  - id: "jse_drop_picard_markduplicates"
    runner: "jse_drop"
    jse_drop_submit_options: "-p multicore -n 2 -t 7-0"
    envs:
      - id: "_JAVA_OPTIONS"
        value: "-Xmx6G -Xms256m"
  # Runner for snp2hla
  - id: "jse_drop_snp2hla"
    runner: "jse_drop"
    jse_drop_submit_options: "-p serial -t 7-0"
    envs:
      - id: "ref_panel"
        value: "/mnt/rvmi/centaurus/galaxy/devel/local_tools/snp2hla/data/REF"
  # Runner for Trinity
  #
  # Trinity docs suggest CPUs <= 12 so 384G available (i.e. 32G/core * 12)
  # Set GALAXY_MEMORY_MB=389120 (no units) (i.e. 380 * 1024)
  #
  # Also need to explicitly set _JAVA_OPTIONS to restrict Java processes to
  # single core (otherwise it seems to take all cores on the node, even if
  # not available)
  - id: "jse_drop_trinity"
    runner: "jse_drop"
    jse_drop_submit_options: "-p himem -n 12 -t 7-0"
    jse_drop_slots: "12"
    envs:
      - id: "GALAXY_MEMORY_MB"
        value: "389120"
      - id: "_JAVA_OPTIONS"
        value: "-XX:ParallelGCThreads=1"

# Tool destinations
galaxy_tool_destinations:
  - id: "__DATA_FETCH__"
    destination: "local"
  - id: "amplicon_analysis_pipeline"
    destination: "jse_drop_amplicon_analysis"
  - id: "bowtie_wrapper"
    destination: "jse_drop_smp_8"
  - id: "bowtie2"
    destination: "jse_drop_smp_8"
  - id: "bwa"
    destination: "jse_drop_smp_8"
  - id: "bwa_mem"
    destination: "jse_drop_smp_8"
  - id: "cd_hit_est"
    destination: "jse_drop_smp_4"
  - id: "cd_hit_protein"
    destination: "jse_drop_smp_4"
  - id: "cuffdiff"
    destination: "jse_drop_smp_8"
  - id: "cufflinks"
    destination: "jse_drop_smp_8"
  - id: "freebayes"
    destination: "jse_drop_smp_8"
  - id: "hisat2"
    destination: "jse_drop_smp_12"
  - id: "ncbi_blastn_wrapper"
    destination: "jse_drop_ncbi_blast_plus"
  - id: "picard_MarkDuplicates"
    destination: "jse_drop_picard_markduplicates"
  - id: "rna_star"
    destination: "jse_drop_smp_8"
  - id: "rnaspades"
    destination: "jse_drop_smp_4_mem512"
  - id: "salmon"
    destination: "jse_drop_smp_4"
  - id: "snp2hla_2"
    destination: "jse_drop_snp2hla"
  - id: "tophat"
    destination: "jse_drop_smp_12"
  - id: "tophat2"
    destination: "jse_drop_smp_12"
  - id: "transdecoder"
    destination: "jse_drop_smp_4"
  - id: "trimmomatic"
    destination: "jse_drop_smp_8"
  - id: "trinityrnaseq"
    destination: "jse_drop_smp_8"
  - id: "trinity"
    destination: "jse_drop_trinity"
  - id: "trinity_align_and_estimate_abundance"
    destination: "jse_drop_smp_4"
  - id: "Cas13d_GuideScoring"
    destination: "jse_drop_short"
  - id: "gRNA_specificity_scorer"
    destination: "jse_drop_short"
  - id: "pdf_report"
    destination: "jse_drop_short"
